<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 브라우저 탭·즐겨찾기·홈 화면 아이콘 — 로고의 M 마크 -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 휴대폰 맨 아래 시스템 바 띠 색 — 화면이 그려지기 전에도 어두운 첫 화면 아래에 흰 띠가 번쩍이지 않게 미리 맞춘다.
         그린 뒤에는 BottomBarTint 가 화면 맨 아래 내용 색을 따라간다 -->
    <script>
      try {
        var p = location.pathname
        var c = p === '/' ? '#0B0E12' : p === '/consultants' || p.indexOf('/ax-industries/') === 0 ? '#020618' : ''
        if (c) document.documentElement.style.backgroundColor = c
      } catch (e) {}
    </script>
    <!-- Google Search Console 소유권 확인 -->
    <meta name="google-site-verification" content="btggGlr9ZK98b7m2qYQ0oK00gw0RtENu-0-cAaER_zE" />
    <title>미래AI랩 | 경영컨설턴트가 설계하는 50인 미만 중소기업 맞춤형 AX</title>
    <meta
      name="description"
      content="사업과 실제 업무를 먼저 분석하고, ERP·엑셀·카톡 사이에 남아 있는 회사 고유의 업무를 AI와 전용 시스템으로 연결합니다. 운영효율·매출성장·기업자산화를 만드는 50인 미만 중소기업 맞춤형 AX 설계·구축."
    />
    <meta property="og:title" content="미래AI랩 | 경영컨설턴트가 설계하는 50인 미만 중소기업 맞춤형 AX" />
    <meta
      property="og:description"
      content="사업과 실제 업무를 먼저 분석하고, ERP·엑셀·카톡 사이에 남아 있는 회사 고유의 업무를 AI와 전용 시스템으로 연결합니다. 운영효율·매출성장·기업자산화를 만드는 50인 미만 중소기업 맞춤형 AX 설계·구축."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="미래AI랩" />
    <meta property="og:locale" content="ko_KR" />
    <!-- 카카오톡·문자·SNS 링크 미리보기 이미지 (절대 주소여야 한다) -->
    <meta property="og:image" content="https://miraeailab.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="미래AI랩 — 50인 미만 중소기업을 위한 AX · 기술사업" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 기술사업·MVP 상세 — PC 첫 화면 오른쪽 그림(벤처기업확인서 + 폰·PC)을 HTML 을 읽는 즉시 받기 시작한다.
         폰에서는 그 그림을 숨기므로 받지 않는다(media). 주소가 다르면 아무것도 하지 않는다. -->
    <script>
      if (location.pathname.replace(/\/+$/, '') === '/business-services/venture-mvp') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.type = 'image/webp'
        l.media = '(min-width: 1024px)'
        l.setAttribute('imagesrcset', '/business/venture-mvp/hero-visual-1000.webp 1000w, /business/venture-mvp/hero-visual.webp 1513w')
        l.setAttribute('imagesizes', '540px')
        l.href = '/business/venture-mvp/hero-visual.webp'
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      }
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
