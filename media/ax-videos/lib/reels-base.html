<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>%TITLE%</title>
<!-- 릴스(9:16) 장면 파일 틀 — reels.mjs 가 장면 · 자막 · 길이 자리를 채운다. ?guide=1 → 안전 영역 선, ?t=초 → 그 순간 화면 -->
<style>
  @font-face { font-family: 'Pretendard'; font-weight: 500; src: url(assets/fonts/Pretendard-Medium.subset.woff2) format('woff2'); }
  @font-face { font-family: 'Pretendard'; font-weight: 600; src: url(assets/fonts/Pretendard-SemiBold.subset.woff2) format('woff2'); }
  @font-face { font-family: 'Pretendard'; font-weight: 700; src: url(assets/fonts/Pretendard-Bold.subset.woff2) format('woff2'); }
  @font-face { font-family: 'Pretendard'; font-weight: 800; src: url(assets/fonts/Pretendard-ExtraBold.subset.woff2) format('woff2'); }
  @font-face { font-family: 'Pretendard'; font-weight: 900; src: url(assets/fonts/Pretendard-Black.subset.woff2) format('woff2'); }
  :root { --bg:#0f1216; --shell:#171b20; --shell2:#22272e; --acc:#d47a4a; --acc2:#b75b2a; --hi:#e8b89a;
          --ink:#f4f1ec; --ink2:rgba(244,241,236,.72); --ink3:rgba(244,241,236,.46); --line:rgba(255,255,255,.09); }
  * { box-sizing:border-box; margin:0; padding:0; animation:none !important; transition:none !important; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--ink);
              font-family:'Pretendard',sans-serif; -webkit-font-smoothing:antialiased; word-break:keep-all; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; }
  .bg { position:absolute; inset:-10%; background:
      radial-gradient(70% 40% at 85% 8%, rgba(212,122,74,.24), transparent 60%),
      radial-gradient(60% 35% at 10% 92%, rgba(232,184,154,.10), transparent 60%),
      linear-gradient(170deg, #12161b 0%, #171b20 45%, #0d1014 100%); }
  .grid { position:absolute; inset:0; opacity:.5;
      background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size:90px 90px; -webkit-mask-image:radial-gradient(80% 55% at 50% 40%, #000 30%, transparent 85%); mask-image:radial-gradient(80% 55% at 50% 40%, #000 30%, transparent 85%); }
  .scene { position:absolute; inset:0; opacity:0; visibility:hidden; }
  .abs { position:absolute; }
  .col { display:flex; flex-direction:column; align-items:flex-start; }
  .col.center { align-items:center; text-align:center; }
  .center-x { left:72px; right:72px; text-align:center; }
  .eyebrow { font-size:26px; font-weight:700; letter-spacing:.3em; color:var(--hi); text-transform:uppercase; }
  .h1 { font-size:88px; font-weight:800; letter-spacing:-.025em; line-height:1.12; }
  .h2 { font-size:64px; font-weight:800; letter-spacing:-.02em; line-height:1.2; }
  .h3 { font-size:46px; font-weight:700; letter-spacing:-.01em; line-height:1.3; }
  .p  { font-size:36px; font-weight:500; color:var(--ink2); line-height:1.5; }
  .acc { color:var(--hi); }
  .glass { background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.025)); border:1px solid rgba(255,255,255,.12);
           border-radius:28px; box-shadow:0 40px 80px -30px rgba(0,0,0,.7); }
  .note { position:absolute; left:72px; right:120px; top:1270px; font-size:22px; font-weight:500; color:var(--ink3); }
  .ic { display:inline-flex; width:40px; height:40px; flex:none; color:var(--hi); } .ic svg { width:100%; height:100%; }

  /* 강조로 바뀌는 상자: data-hl 시각부터 --hl 0 → 1 */
  .hlbox { position:relative; }
  .hlbox::before { content:''; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none; opacity:var(--hl,0);
                   background:linear-gradient(160deg, rgba(212,122,74,.30), rgba(212,122,74,.10)); border:1.5px solid rgba(232,184,154,.62); }
  .hlbox > * { position:relative; }

  /* 칩 */
  .chip { display:inline-flex; align-items:center; gap:14px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:700; white-space:nowrap;
          background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); box-shadow:0 20px 40px -20px rgba(0,0,0,.6); }
  .chip .ic { width:34px; height:34px; }
  .chip.abs { position:absolute; }
  /* 번호 태그 */
  .ntag { display:flex; align-items:center; gap:22px; padding:20px 30px 20px 20px; border-radius:24px; font-size:38px; font-weight:700; line-height:1.3;
          background:rgba(15,18,22,.6); border:1px solid rgba(232,184,154,.45); }
  .ntag .n { flex:none; display:grid; place-items:center; width:52px; height:52px; border-radius:50%; background:var(--acc); color:#171b20; font-size:28px; font-weight:800; }
  .ntag small, .ck small, .tl small { display:block; margin-top:4px; font-size:28px; font-weight:500; color:var(--ink2); }
  /* 체크 목록 */
  .ck { display:flex; align-items:center; gap:24px; font-size:40px; font-weight:700; line-height:1.3; }
  .ck .cc { flex:none; display:grid; place-items:center; width:58px; height:58px; border-radius:50%; background:var(--acc); color:#171b20; }
  .ck .cc svg { width:34px; height:34px; }
  /* 카드 안쪽 */
  .ci { display:flex; align-items:center; gap:26px; padding:28px 32px; }
  .ci .cic { flex:none; display:grid; place-items:center; width:84px; height:84px; border-radius:24px; background:rgba(212,122,74,.14); border:1px solid rgba(232,184,154,.3); }
  .ci .cic .ic { width:46px; height:46px; }
  .ci b { display:block; font-size:40px; font-weight:800; letter-spacing:-.01em; line-height:1.25; }
  .ci small { display:block; margin-top:6px; font-size:29px; font-weight:500; color:var(--ink2); line-height:1.4; }
  .flowbox .ci { height:100%; padding:0 30px; }
  .flowbox .ci .cic { width:68px; height:68px; border-radius:20px; } .flowbox .ci .cic .ic { width:38px; height:38px; }
  .flowbox .ci b { font-size:38px; }
  .flowbox .ci small { font-size:26px; margin-top:2px; }
  svg.vline path, svg.tline path, svg.draw path { fill:none; stroke:var(--acc); stroke-width:4; stroke-linecap:round; stroke-dasharray:1 1; }
  svg.vline { overflow:visible; }
  svg.tline path.base { stroke:rgba(255,255,255,.12); stroke-dasharray:none; }
  /* 타임라인 */
  .tl { position:absolute; display:flex; align-items:flex-start; gap:34px; font-weight:700; line-height:1.3; }
  .tl .dot { flex:none; margin-top:6px; width:56px; height:56px; border-radius:50%; background:#171b20; border:4px solid var(--acc); box-shadow:0 0 0 8px rgba(212,122,74,.14); }
  /* 휴대폰 · 브라우저 */
  .phone { position:absolute; padding:14px; border-radius:54px; background:#050607; box-shadow:0 0 0 2px rgba(255,255,255,.14), 0 50px 100px -30px rgba(0,0,0,.85); }
  .phone .scr { position:relative; overflow:hidden; border-radius:40px; background:#fff; }
  .phone .scr img { position:absolute; left:0; top:0; display:block; transform-origin:50% 0; }
  .phone .notch { position:absolute; left:50%; top:24px; width:120px; height:30px; margin-left:-60px; border-radius:20px; background:#050607; }
  .phone.cut { -webkit-mask-image:linear-gradient(#000 82%, transparent 100%); mask-image:linear-gradient(#000 82%, transparent 100%); }
  .browser { position:absolute; overflow:hidden; border-radius:22px; background:#0b0d10; border:1px solid rgba(255,255,255,.12); box-shadow:0 50px 100px -30px rgba(0,0,0,.85); }
  .browser .bbar { display:flex; align-items:center; gap:10px; height:52px; padding:0 20px; background:#1a1e24; }
  .browser .bbar i { width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.22); }
  .browser .bbar span { margin-left:16px; flex:1; height:32px; line-height:32px; padding:0 16px; border-radius:10px; background:rgba(255,255,255,.07); color:var(--ink3); font-size:20px; font-weight:600; }
  .browser .bview { position:relative; overflow:hidden; background:#fff; }
  .browser .bview img { position:absolute; left:0; top:0; display:block; transform-origin:0 0; }
  .touch { position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%; border:5px solid var(--acc); background:rgba(212,122,74,.25); opacity:0; }
  /* 취소선 */
  .strike-wrap .st { position:relative; display:inline-block; }
  .strike-wrap .sl { position:absolute; left:-6px; right:-6px; top:54%; height:6px; border-radius:3px; background:var(--acc); transform-origin:0 50%; transform:scaleX(0); }
  /* 순환도 */
  svg.loop ellipse.base { fill:none; stroke:rgba(255,255,255,.10); stroke-width:3; }
  svg.loop path { fill:none; stroke:var(--acc); stroke-width:5; stroke-linecap:round; stroke-dasharray:1 1; }
  .lnode { position:absolute; width:0; height:0; transform-origin:0 0; }
  .lnb { position:absolute; left:0; top:0; transform:translate(-50%,-50%); display:flex; align-items:center; gap:14px; padding:16px 26px 16px 16px; border-radius:999px;
         background:#1b2026; border:1px solid rgba(255,255,255,.16); font-size:31px; font-weight:700; white-space:nowrap; box-shadow:0 20px 40px -18px rgba(0,0,0,.7); }
  .lnb.hlbox > * { position:relative; }
  .lnb .lic { display:grid; place-items:center; width:54px; height:54px; border-radius:50%; background:rgba(212,122,74,.18); }
  .lnb .lic .ic { width:30px; height:30px; }
  .ldot { position:absolute; left:0; top:0; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:var(--hi); box-shadow:0 0 0 10px rgba(212,122,74,.22), 0 0 34px rgba(232,184,154,.8); opacity:0; }
  .lcenter { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; }
  /* 막대 */
  .bar { position:relative; display:inline-block; width:240px; height:14px; border-radius:7px; background:rgba(0,0,0,.08); overflow:hidden; vertical-align:middle; }
  .bar i { position:absolute; inset:0; border-radius:7px; background:var(--acc); transform-origin:0 50%; transform:scaleX(0); }
  /* 앱 화면을 닮은 예시 카드 */
  .mock { position:absolute; overflow:hidden; border-radius:34px; background:#fff; color:#15181d; box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 50px 110px -30px rgba(0,0,0,.85); }
  .mock .mh { display:flex; align-items:center; gap:16px; padding:28px 34px; color:#fff; font-size:34px; font-weight:800; letter-spacing:-.02em; }
  .mock .mh .ic { width:40px; height:40px; }
  .mock .mh em { margin-left:auto; padding:6px 14px; border-radius:10px; background:rgba(255,255,255,.16); font-style:normal; font-size:20px; font-weight:700; }
  .mock.ops .mh { background:#0a1020; } .mock.ops .mh .ic { color:#5b9bf0; }
  .mock.well .mh { background:#0f4e4b; } .mock.well .mh .ic { color:#e3c99a; }
  .mock .mb { display:flex; flex-direction:column; gap:16px; padding:28px 30px 32px; }
  .mock .row { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 26px; border-radius:20px; background:#f2f4f8; font-size:32px; font-weight:700; }
  .mock .row small { font-size:25px; font-weight:600; color:#6b7380; }
  .mock .row .ic { width:44px; height:44px; color:#2e7be6; }
  .mock.well .row { background:#f4eee3; } .mock.well .row b { color:#0f4e4b; } .mock.well .row .ic { color:#0f4e4b; }
  .mock.well .bar { background:#e2d8c6; } .mock.well .bar i { background:#0f4e4b; }
  .mock .btn { display:inline-flex; align-items:center; gap:10px; padding:14px 24px; border-radius:14px; background:#2e7be6; color:#fff; font-size:26px; font-weight:800; }
  .mock.well .btn { background:#0f4e4b; }
  .mock .pill { display:inline-block; padding:6px 14px; border-radius:10px; background:#e8f0fd; color:#1f5fc2; font-size:22px; font-weight:800; }
  .mock.well .pill { background:#e6efe9; color:#0f4e4b; }
  /* 작은 카드 · 지도 */
  .mini { display:flex; flex-direction:column; align-items:center; gap:14px; padding:28px 16px; text-align:center; }
  .mini .ic { width:52px; height:52px; } .mini b { font-size:32px; font-weight:800; line-height:1.25; }
  .routemap { overflow:hidden; background-image:linear-gradient(rgba(255,255,255,.05) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.05) 2px, transparent 2px), linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.025)); background-size:110px 110px, 110px 110px, auto; }
  .routemap svg.draw path { stroke-width:6; }
  .pin { display:grid; place-items:center; width:60px; height:60px; border-radius:50%; background:#1b2026; border:1.5px solid rgba(232,184,154,.5); }
  .pin .ic { width:30px; height:30px; }
  .depot { display:grid; place-items:center; width:64px; height:64px; border-radius:18px; background:var(--acc); }
  .depot .ic { width:36px; height:36px; color:#171b20; }
  .custone { display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; }
  .custone .cic { display:grid; place-items:center; background:rgba(212,122,74,.14); border:1px solid rgba(232,184,154,.3); }
  .custone .cic .ic { width:80px; height:80px; } .custone b { font-size:34px; font-weight:800; line-height:1.3; }
  .kvs { display:flex; flex-direction:column; gap:12px; padding:0 32px 28px 142px; }
  .kv { display:flex; align-items:center; gap:14px; font-size:34px; font-weight:700; }
  .kv .ic { width:34px; height:34px; }
  /* 끝 화면 */
  .logo-box { position:absolute; display:grid; place-items:center; width:500px; height:170px; border-radius:34px; background:#fff; box-shadow:0 30px 70px -20px rgba(0,0,0,.7); }
  .logo-box img { width:430px; height:auto; }
  .cta { display:inline-flex; align-items:center; justify-content:center; min-width:560px; padding:26px 40px; border-radius:22px; background:var(--acc); color:#171b20; font-size:36px; font-weight:800; }
  .cta.sub { background:rgba(255,255,255,.06); color:var(--ink); border:1px solid rgba(255,255,255,.16); font-weight:700; }
  /* 큰 숫자(편 번호) */
  .bignum { font-size:300px; font-weight:900; line-height:1; letter-spacing:-.04em; color:transparent; -webkit-text-stroke:3px rgba(232,184,154,.55); }
  .tagline { display:inline-flex; align-items:center; gap:12px; padding:12px 24px; border-radius:999px; background:rgba(212,122,74,.16); border:1px solid rgba(232,184,154,.45); color:var(--hi); font-size:28px; font-weight:800; }
  .tagline .ic { width:30px; height:30px; }

  /* 자막 */
  #sub { position:absolute; left:132px; right:132px; top:1330px; height:180px; display:flex; align-items:flex-end; justify-content:center; opacity:0; }
  #sub span { max-width:816px; padding:16px 30px; border-radius:20px; background:rgba(15,18,22,.80); border:1px solid rgba(255,255,255,.10);
              font-size:46px; font-weight:700; letter-spacing:-.01em; line-height:1.42; text-align:center; white-space:pre-line; }
  #sub b { color:var(--hi); font-weight:800; }
  /* 안전 영역 확인선 (?guide=1) */
  .guide { position:absolute; pointer-events:none; outline:2px dashed rgba(255,80,80,.8); display:none; z-index:99; }
  body.show-guide .guide { display:block; }
</style></head>
<body><div id="stage">
  <div class="bg" id="bg"></div><div class="grid"></div>
%SCENES%
  <div id="sub"><span></span></div>
  <div class="guide" style="left:0;right:0;top:0;height:220px"></div>
  <div class="guide" style="left:72px;width:888px;top:220px;height:1080px"></div>
  <div class="guide" style="left:132px;right:132px;top:1330px;height:180px"></div>
  <div class="guide" style="left:0;right:0;top:1520px;bottom:0"></div>
  <div class="guide" style="left:960px;right:0;top:220px;height:1300px"></div>
</div>
<script>
  const SUBS = %SUBS%;
  window.DUR = %DUR%;
  const qs = new URLSearchParams(location.search);
  if (qs.get('guide')) document.body.classList.add('show-guide');

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const eo = (x) => 1 - Math.pow(1 - x, 3);
  const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, x) => a + (b - a) * x;
  const vis = (t, tin, tout, d = .6) => Math.min(eo(clamp((t - tin) / d)), 1 - eio(clamp((t - (tout - d * .8)) / (d * .8))));
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const DUR_IN = { up: .7, left: .7, scale: .8, card: .8, fade: .6, scene: .55, none: .35 };
  const num = (v) => v == null ? null : +v;

  const items = [...document.querySelectorAll('[data-in]')].map((el) => {
    const isScene = el.classList.contains('scene');
    const sc = isScene ? null : el.closest('.scene');
    const a = el.dataset.a || 'fade';
    return { el, isScene, sc, a, tin: +el.dataset.in, tout: el.dataset.out != null ? +el.dataset.out : (sc ? +sc.dataset.out : 1e9),
             dim: num(el.dataset.dim), hl: num(el.dataset.hl), d: DUR_IN[a] ?? .7, mv: el.dataset.mv ? el.dataset.mv.split(',').map(Number) : null };
  });
  const scenes = items.filter((x) => x.isScene);
  const kbs = [...document.querySelectorAll('[data-kb]')].map((el) => ({ el, sc: el.closest('.scene'), v: el.dataset.kb.split(',').map(Number) }));
  const draws = [...document.querySelectorAll('[data-draw]')].map((el) => ({ el, sc: el.closest('.scene'), v: el.dataset.draw.split(',').map(Number) }));
  const strikes = [...document.querySelectorAll('[data-strike]')].map((el) => ({ el, sc: el.closest('.scene'), t: +el.dataset.strike }));
  const orbits = [...document.querySelectorAll('[data-orbit]')].map((el) => ({ el, sc: el.closest('.scene'), v: el.dataset.orbit.split(',').map(Number) }));
  const fills = [...document.querySelectorAll('[data-fill]')].map((el) => ({ el, sc: el.closest('.scene'), v: el.dataset.fill.split(',').map(Number) }));
  const touches = [...document.querySelectorAll('[data-touch]')].map((el) => ({ el, sc: el.closest('.scene'), t: +el.dataset.touch }));
  const shown = (sc) => !sc || sc.style.visibility !== 'hidden';

  const subEl = document.querySelector('#sub span');
  let subIdx = -2;

  function render(t) {
    document.getElementById('bg').style.transform = `translate(${Math.sin(t / 9) * 30}px, ${Math.cos(t / 11) * 20}px) scale(1.04)`;
    // 장면부터: 안 보이는 장면은 통째로 숨겨 그리지 않는다
    for (const s of scenes) {
      const o = vis(t, s.tin, s.tout, .55);
      s.el.style.opacity = o;
      s.el.style.visibility = o > 0.001 ? 'visible' : 'hidden';
    }
    for (const x of items) {
      if (x.isScene || !shown(x.sc)) continue;
      const { el, tin, tout, a, d } = x;
      let o = vis(t, tin, tout, d);
      if (x.dim != null) o *= lerp(1, .62, eo(clamp((t - x.dim) / .5)));
      el.style.opacity = o;
      const p = eo(clamp((t - tin) / (d + .1)));
      if (a === 'up') el.style.transform = `translateY(${(1 - p) * 34}px)`;
      else if (a === 'left') el.style.transform = `translateX(${(1 - p) * -60}px)`;
      else if (a === 'scale') el.style.transform = `scale(${lerp(.94, 1, p)})`;
      else if (a === 'card') el.style.transform = `translateY(${(1 - p) * 60}px) scale(${lerp(.92, 1, p)})`;
      // 옮기기: data-mv="t0,t1,dx,dy" — t0~t1 동안 (dx,dy) 만큼 천천히 이동
      if (x.mv) { const [m0, m1, dx, dy] = x.mv; const q = eio(clamp((t - m0) / (m1 - m0))); el.style.transform = (a === 'up' || a === 'left' || a === 'scale' || a === 'card' ? el.style.transform + ' ' : '') + `translate(${dx * q}px, ${dy * q}px)`; }
      if (x.hl != null) el.style.setProperty('--hl', eo(clamp((t - x.hl) / .5)));
    }
    // 화면 천천히 확대: data-kb="시작,끝,배율0,x0,y0,배율1,x1,y1"
    for (const k of kbs) {
      if (!shown(k.sc)) continue;
      const [a, b, s0, x0, y0, s1, x1, y1] = k.v;
      const q = eio(clamp((t - a) / (b - a)));
      k.el.style.transform = `translate(${lerp(x0, x1, q)}px, ${lerp(y0, y1, q)}px) scale(${lerp(s0, s1, q)})`;
    }
    // 선 그리기: data-draw="시작,끝" (pathLength=1)
    for (const k of draws) { if (shown(k.sc)) k.el.style.strokeDashoffset = 1 - eio(clamp((t - k.v[0]) / Math.max(.01, k.v[1] - k.v[0]))); }
    // 취소선: 0.8초
    for (const k of strikes) { if (shown(k.sc)) k.el.style.transform = `scaleX(${eio(clamp((t - k.t) / .8))})`; }
    // 따라 도는 점: data-orbit="t0,t1,cx,cy,rx,ry,각도0,각도1"
    for (const k of orbits) {
      if (!shown(k.sc)) continue;
      const [a, b, cx, cy, rx, ry, g0, g1] = k.v;
      const q = clamp((t - a) / (b - a));
      const g = (lerp(g0, g1, q)) * Math.PI / 180;
      k.el.style.transform = `translate(${cx + rx * Math.cos(g)}px, ${cy + ry * Math.sin(g)}px)`;
      k.el.style.opacity = t < a ? 0 : Math.min(clamp((t - a) / .4), 1);
    }
    // 막대 채우기: data-fill="t0,t1,값"
    for (const k of fills) { if (shown(k.sc)) k.el.style.transform = `scaleX(${lerp(0, k.v[2], eo(clamp((t - k.v[0]) / (k.v[1] - k.v[0]))))})`; }
    // 누르는 곳 물결: 0.6초
    for (const k of touches) {
      if (!shown(k.sc)) continue;
      const q = (t - k.t) / .6;
      k.el.style.opacity = q < 0 || q > 1 ? 0 : (1 - q) * .95;
      k.el.style.transform = `scale(${lerp(.4, 1.5, eo(clamp(q)))})`;
    }
    // 자막
    const i = SUBS.findIndex(([a, b]) => t >= a - .12 && t < b + .12);
    if (i !== subIdx) { subIdx = i; if (i >= 0) subEl.innerHTML = esc(SUBS[i][2]).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
    const box = subEl.parentElement;
    if (i < 0) box.style.opacity = 0;
    else { const [a, b] = SUBS[i]; box.style.opacity = Math.min(clamp((t - a + .12) / .12), clamp((b + .12 - t) / .12)); }
  }
  window.render = render;
  window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {}))]);
  render(+(qs.get('t') || 0));
</script>
</body></html>
